name: Release

on:
  push:
    branches:
      - "main"
      - "develop"
    tags:
      - 'v*'
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/images/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/images/**'
      - '**.md'

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  GO_VERSION: '1.23.4'

permissions:
  contents: write
  packages: write
  # Needed for cosign
  id-token: write

jobs:
  prepare:
    name: Prepare release artifacts for ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Needed for docker builds
      DOCKER_CLI_EXPERIMENTAL: "enabled"
      # Pass builder info to goreleaser
      BUILDER: ${{ github.actor }}@github-actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup steps common for all OS
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Linux specific setup
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: matrix.os == 'ubuntu-latest'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: matrix.os == 'ubuntu-latest'
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: matrix.os == 'ubuntu-latest' # Only login where docker builds happen
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calculate cache key
      - name: Get short SHA
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # Cache dist directory per OS
      - name: Cache dist (Linux)
        uses: actions/cache@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          path: dist/linux* # Cache all linux variants
          key: linux-${{ env.sha_short }}
      - name: Cache dist (macOS)
        uses: actions/cache@v4
        if: matrix.os == 'macos-latest'
        with:
          path: dist/darwin* # Cache all darwin variants
          key: darwin-${{ env.sha_short }}
      - name: Cache dist (Windows)
        uses: actions/cache@v4
        if: matrix.os == 'windows-latest'
        with:
          path: dist/windows* # Cache all windows variants
          key: windows-${{ env.sha_short }}
          enableCrossOsArchive: true # Needed for caching between windows/non-windows

      # Run goreleaser split build
      - name: Run GoReleaser split build
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean --split --parallelism 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use default token for commit access if needed by hooks
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

  release:
    name: Merge artifacts and publish release
    runs-on: ubuntu-latest
    needs: prepare
    env:
      # Needed for docker builds/pushes
      DOCKER_CLI_EXPERIMENTAL: "enabled"
      # Pass builder info to goreleaser
      BUILDER: ${{ github.actor }}@github-actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Go (still needed for goreleaser command)
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # - name: Install Cosign # Uncomment if you add signing to goreleaser.yml
      #   uses: sigstore/cosign-installer@v3.8.2
      # - name: Install Syft # Uncomment if you add SBOMs to goreleaser.yml
      #   uses: anchore/sbom-action/download-syft@v0.19.0

      # Calculate cache key again to restore
      - name: Get short SHA
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # Restore all cached dist directories
      - name: Restore dist (Linux)
        uses: actions/cache@v4
        with:
          path: dist/linux*
          key: linux-${{ env.sha_short }}
      - name: Restore dist (macOS)
        uses: actions/cache@v4
        with:
          path: dist/darwin*
          key: darwin-${{ env.sha_short }}
      - name: Restore dist (Windows)
        uses: actions/cache@v4
        with:
          path: dist/windows*
          key: windows-${{ env.sha_short }}
          enableCrossOsArchive: true

      # Run goreleaser merge and publish
      # Only publish on tag pushes
      - name: Run GoReleaser merge and publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: continue --merge --parallelism 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use default token for release publishing
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      # Run goreleaser merge without publishing for PRs/branches
      - name: Run GoReleaser merge check
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: continue --merge --skip=publish --parallelism 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        platform:
          - linux/amd64
          # - linux/amd64/v2 # Goreleaser builds don't use v2/v3, adjust if needed
          # - linux/amd64/v3
          - linux/arm/v6
          - linux/arm/v7
          - linux/arm64
    # This job can run in parallel with prepare/release or depend on them if needed
    # needs: [ prepare ] # Optional dependency
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=auto

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request') && 'true' || 'false' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            BUILDER=${{ github.actor }}@github-actions
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false # Set to true if you need build provenance

      - name: Export image digest
        id: digest-prep
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          echo "manifest-hash=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-digests-${{ steps.digest-prep.outputs.manifest-hash }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Publish Docker multi-arch manifest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [ docker ] # Depends on the docker build job
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: docker-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=auto

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
