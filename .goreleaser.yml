version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ptparchiver
    env:
      - CGO_ENABLED=0
      - BUILDER
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - 6
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: arm
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: arm64
    main: ./cmd/ptparchiver/main.go
    binary: ptparchiver
    ldflags:
      - -s -w
      - -X github.com/s0up4200/ptparchiver-go/pkg/version.Version={{.Version}}
      - -X github.com/s0up4200/ptparchiver-go/pkg/version.Commit={{.ShortCommit}}
      - -X "github.com/s0up4200/ptparchiver-go/pkg/version.Date={{.CommitDate}}"
      - -X "github.com/s0up4200/ptparchiver-go/pkg/version.BuiltBy={{.Env.BUILDER}}"

archives:
  - format_overrides:
      - goos: windows
        formats: [ zip ]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

release:
  prerelease: auto
  footer: |
    **Full Changelog**: https://github.com/s0up4200/ptparchiver-go/compare/{{ .PreviousTag }}...{{ .Tag }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: "New Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 10
    - title: Other work
      order: 999

nfpms:
  - package_name: ptparchiver
    maintainer: s0up4200
    description: |-
      ptparchiver is a tool for archiving PTP torrents.
    formats:
      - apk
      - deb
      - rpm
      - archlinux

# Docker configuration
# Reference: https://goreleaser.com/customization/docker/
dockers:
  # Linux amd64
  - image_templates:
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-amd64"
    dockerfile: ci.Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ time \"2006-01-02T15:04:05Z\" }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT" # Adjust if your license is different
      - "--build-arg=BUILDTIME={{ time \"2006-01-02T15:04:05Z\" }}"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=REVISION={{ .FullCommit }}"
      - "--build-arg=BUILDER={{ .Env.BUILDER }}"
    goos: linux
    goarch: amd64

  # Linux arm64
  - image_templates:
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-arm64"
    dockerfile: ci.Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ time \"2006-01-02T15:04:05Z\" }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT" # Adjust if your license is different
      - "--build-arg=BUILDTIME={{ time \"2006-01-02T15:04:05Z\" }}"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=REVISION={{ .FullCommit }}"
      - "--build-arg=BUILDER={{ .Env.BUILDER }}"
    goos: linux
    goarch: arm64

  # Linux armv7
  - image_templates:
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-armv7"
    dockerfile: ci.Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm/v7"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ time \"2006-01-02T15:04:05Z\" }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT" # Adjust if your license is different
      - "--build-arg=BUILDTIME={{ time \"2006-01-02T15:04:05Z\" }}"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=REVISION={{ .FullCommit }}"
      - "--build-arg=BUILDER={{ .Env.BUILDER }}"
    goos: linux
    goarch: arm
    goarm: 7

  # Linux armv6
  - image_templates:
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-armv6"
    dockerfile: ci.Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm/v6"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ time \"2006-01-02T15:04:05Z\" }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT" # Adjust if your license is different
      - "--build-arg=BUILDTIME={{ time \"2006-01-02T15:04:05Z\" }}"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=REVISION={{ .FullCommit }}"
      - "--build-arg=BUILDER={{ .Env.BUILDER }}"
    goos: linux
    goarch: arm
    goarm: 6

# Docker Manifests
# Reference: https://goreleaser.com/customization/docker_manifest/
docker_manifests:
  # Create versioned manifest (e.g., v1.2.3)
  - name_template: "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}"
    image_templates:
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-amd64"
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-arm64"
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-armv7"
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-armv6"

  # Create minor version manifest (e.g., v1.2)
  - name_template: "{{ .Env.REGISTRY_IMAGE }}:{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-amd64"
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-arm64"
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-armv7"
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-armv6"

  # Create latest manifest (only for non-prereleases)
  - name_template: "{{ .Env.REGISTRY_IMAGE }}:latest"
    image_templates:
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-amd64"
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-arm64"
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-armv7"
      - "{{ .Env.REGISTRY_IMAGE }}:{{ .Version }}-armv6"
    # Only push latest for actual releases, not pre-releases
    skip_push: "{{ .IsSnapshot }}"

